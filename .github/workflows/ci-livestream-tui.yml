name: Livestream TUI

on:
    pull_request:
        paths:
            - '.github/workflows/ci-livestream-tui.yml'
            - 'livestream/**'

permissions:
    contents: read

jobs:
    lint-and-test:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: '1.25.5'

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
              with:
                  version: latest
                  working-directory: livestream
                  args: --timeout=5m ./tui/...

            - name: Run tests
              run: cd livestream && make -f Makefile.tui test

    build:
        runs-on: ${{ matrix.runner }}
        strategy:
            matrix:
                include:
                    - runner: ubuntu-24.04
                      arch: amd64
                    - runner: ubuntu-24.04-arm
                      arch: arm64

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: '1.25.5'

            - name: Build
              run: cd livestream && make -f Makefile.tui build
