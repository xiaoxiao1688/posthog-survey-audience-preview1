name: Updated PR

on:
    pull_request:
        types:
            - opened
            - edited
            - synchronize

jobs:
    lint-pr:
        name: Validate PR title against Conventional Commits
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
